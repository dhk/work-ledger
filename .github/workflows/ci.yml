name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # test + patterns extras cover everything the suite needs, including
      # the MCP smoke test (tests/test_mcp_server.py already skips itself
      # via pytest.importorskip if mcp isn't installed - installing it here
      # means that test actually runs instead of just skipping). The
      # `report` extra needs a real Chromium download for PNG rendering,
      # which nothing in the test suite exercises (test_report.py only
      # covers build_report_html, not render_png) - not installed here.
      - name: Install work-ledger (test + patterns extras)
        run: pip install -e ".[test,patterns]"

      - name: Compile check
        run: python -m py_compile work_ledger/*.py

      - name: Run tests
        run: pytest
