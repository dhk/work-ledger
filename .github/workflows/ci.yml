name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # test + patterns extras cover everything the suite needs, including
      # the MCP smoke test (tests/test_mcp_server.py already skips itself
      # via pytest.importorskip if mcp isn't installed - installing it here
      # means that test actually runs instead of just skipping). The
      # `report` extra needs a real Chromium download for PNG rendering,
      # which nothing in the test suite exercises (test_report.py only
      # covers build_report_html, not render_png) - not installed here.
      - name: Install work-ledger (test + patterns extras)
        run: python -m pip install -e ".[test,patterns]"

      - name: Compile check
        run: python -m compileall -q work_ledger

      # --cov-fail-under is set from what the suite actually measures today
      # (~65.5%, see #48), not a guessed round number - it's a floor to
      # ratchet up as gaps close, not an aspirational target. `render_png`
      # (report.py) is marked `# pragma: no cover` and excluded from this
      # number on purpose - see that function's docstring and this file's
      # "report extra" comment above for why (needs a real Chromium
      # download this job doesn't install).
      - name: Run tests
        run: pytest --cov=work_ledger --cov-report=term-missing --cov-fail-under=65

  demo-drift:
    # docs/demo/ is rendered by report.py's real functions (see
    # scripts/build_demo.py), and it's what docs/index.html - the published
    # GitHub Pages site - shows people who haven't installed anything. A
    # rendering change that doesn't reach the demo turns it into a picture
    # of a version that no longer exists. That is exactly how PR #41's
    # "matches actual product output" asset went stale for a hundred
    # commits, and it's issue #109's core ask: make staleness impossible
    # rather than merely unlikely.
    #
    # Scope, stated honestly: this regenerates the HTML only. The PNG
    # stills need a real Chromium the Python matrix above deliberately
    # doesn't install (see its "report extra" comment). HTML drift is a
    # good proxy - both come from the same renderers, so a change that
    # would alter a still almost always alters the HTML first - but if this
    # job fails, regenerate with `--png` so the images move too, rather
    # than committing HTML that no longer matches the pictures beside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install work-ledger
        run: python -m pip install -e .

      - name: Regenerate the demo pages
        run: python scripts/build_demo.py

      - name: Fail if the checked-in demo is stale
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/demo; then
            echo "docs/demo is up to date with the current renderers."
            exit 0
          fi
          echo "::error::docs/demo is stale - regenerating it here produced a different result than what's committed. Run 'python scripts/build_demo.py --png' and commit the result. See docs/demo/README.md."
          git diff --stat -- docs/demo
          git diff -- docs/demo | head -100
          exit 1

  backend-test:
    # backend/ (the Vercel + Upstash counter/findings service - see #45) is
    # a separate deployable with its own tiny test suite (route-level smoke
    # tests: responds, rejects malformed input - see backend/test/). Kept as
    # its own job, non-blocking (continue-on-error), so a regression there
    # is visible without holding up the Python matrix above, which is what
    # this repo's actual package/tests are.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
