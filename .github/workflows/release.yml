name: release

# Publishing to PyPI is irreversible - a version number can never be
# reused, even after a delete - so this workflow gates the upload behind
# checks the 0.1.0 release didn't have: the version being built must match
# the tag that triggered it, the test suite must pass, and the built wheel
# must actually expose the CLI. See RELEASING.md for the human side.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    # The failure this prevents: cutting a release tagged 0.3.0 while
    # pyproject.toml still says 0.2.0. The build takes its version from
    # pyproject, so the upload either collides with the already-published
    # 0.2.0 and fails deep inside the publish step, or - worse, if 0.2.0
    # was never published - silently ships an artifact whose version
    # doesn't match the release, the tag, or the changelog. Catching it
    # here costs seconds and the fix is a one-line bump; catching it at
    # the upload step means a burnt tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the version being built
        env:
          # Via env rather than inline interpolation - a tag name is
          # attacker-influenced input in the general case, and inlining it
          # into a shell script is the standard injection footgun.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          # Tolerate a leading "v" so a v0.2.0-style tag doesn't fail the
          # release outright, even though 0.1.0 set the bare convention.
          tag_version="${RELEASE_TAG#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match pyproject.toml version '${project_version}'."
            echo "Bump the version in pyproject.toml (and CHANGELOG.md) to match the tag, or retag the release. See RELEASING.md."
            exit 1
          fi
          echo "Releasing version ${project_version} (tag ${RELEASE_TAG})."

  test:
    # The 0.1.0 release published without running the suite at all. "CI was
    # green on main" is not the same claim: a release can be cut from any
    # commit, including one that never had a passing run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install work-ledger (test + patterns extras)
        run: python -m pip install -e ".[test,patterns]"

      - name: Run tests
        run: pytest -q

  build:
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the built wheel actually exposes its commands
        # Guards the specific shape of #103: the published 0.1.0 wheel was
        # missing twelve subcommands the docs advertised. Installing the
        # built wheel (not the checkout) and asking each subcommand for its
        # own --help catches a packaging regression - a missed `packages`
        # entry, say - before upload rather than after someone pip-installs
        # it. Exit status, not a grep over `--help` text: every name below
        # also appears in prose or in a flag (`--session`), so a substring
        # match would still pass with the subcommand gone.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet dist/*.whl
          missing=""
          for command in about activity sessions serve timeline trend rollup waste miso cycle history session; do
            if ! /tmp/wheelcheck/bin/work-ledger "$command" --help >/dev/null 2>&1; then
              missing="${missing} ${command}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Built wheel's CLI is missing:${missing}"
            exit 1
          fi
          echo "Built wheel exposes every expected command."

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/work-ledger
    permissions:
      # Required for PyPI's Trusted Publishing (OIDC) - no API token
      # stored as a secret anywhere. See https://docs.pypi.org/trusted-publishers/
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
